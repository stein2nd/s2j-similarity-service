openapi: 3.0.3

info:
  title: S2J Similarity Service API
  version: 1.0.0
  description: |
    Single Source of Truth for:
    - TypeScript types
    - Zod schemas
    - PHP DTOs
  license:
    name: GNU General Public License v3.0 or later
    url: https://www.gnu.org/licenses/gpl-3.0.en.html

servers:
  - url: '{scheme}://{host}'
    description: API origin (path prefixes `/v1/...` are defined under paths).
    variables:
      scheme:
        enum:
          - http
          - https
        default: https
      host:
        default: localhost:8080
        description: Hostname and port for your deployment.

security:
  - bearerAuth: []

paths:
  /v1/similarity:
    post:
      operationId: calculateSimilarity
      summary: Calculate semantic similarity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimilarityRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/embedding:
    post:
      operationId: generateEmbedding
      summary: Generate embedding vector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token as described in docs/interfaces/rest_api_spec.md.

  schemas:
    SimilarityRequest:
      type: object
      required:
        - textA
        - textB
      properties:
        textA:
          type: string
          minLength: 1
          description: Input text A (must not be empty).
        textB:
          type: string
          minLength: 1
          description: Input text B (must not be empty).
        model:
          type: string
          nullable: true
          description: Optional embedding model identifier.

    EmbeddingRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Input text (must not be empty).
        model:
          type: string
          nullable: true
          description: Optional embedding model identifier.

    ResponseMeta:
      type: object
      description: Response metadata (may be an empty object).
      additionalProperties: true

    SimilarityResultData:
      type: object
      required:
        - similarityScore
      properties:
        similarityScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Semantic similarity in the range 0..1.

    EmbeddingResultData:
      type: object
      required:
        - vector
        - dimension
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          description: Embedding vector components.
        dimension:
          type: integer
          minimum: 1
          description: Length of the embedding vector.

    SimilarityResponse:
      type: object
      description: >
        HTTP success body for POST /v1/similarity (docs/interfaces/rest_api_spec.md).
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/SimilarityResultData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    EmbeddingResponse:
      type: object
      description: >
        HTTP success body for POST /v1/embedding (docs/interfaces/rest_api_spec.md).
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/EmbeddingResultData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'

    ErrorObject:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          description: >
            Stable machine-readable error category (snake_case).
            Aligns with docs/interfaces/rest_api_spec.md (e.g. validation_error, auth_error).
          enum:
            - validation_error
            - auth_error
            - permission_error
            - not_found
            - timeout
            - rate_limit
            - internal_error
            - provider_error
            - network_error
          example: validation_error
        message:
          type: string
          description: Human-readable error message.
          example: Invalid input
        details:
          type: object
          nullable: true
          description: Optional structured context (field hints, provider payloads, etc.).
          additionalProperties: true
