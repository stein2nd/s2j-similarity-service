openapi: 3.0.3

info:
title: S2J Similarity Service API
version: 1.0.0
description: |
Single Source of Truth for:
- TypeScript types
- Zod schemas
- PHP DTOs

servers:

* url: http://localhost

paths:

/v1/similarity:
post:
operationId: calculateSimilarity
summary: Calculate semantic similarity
requestBody:
required: true
content:
application/json:
schema:
$ref: '#/components/schemas/SimilarityRequest'
responses:
'200':
description: Success
content:
application/json:
schema:
$ref: '#/components/schemas/SimilarityResponse'

/v1/embedding:
post:
operationId: generateEmbedding
summary: Generate embedding vector
requestBody:
required: true
content:
application/json:
schema:
$ref: '#/components/schemas/EmbeddingRequest'
responses:
'200':
description: Success
content:
application/json:
schema:
$ref: '#/components/schemas/EmbeddingResponse'

components:

schemas:

```
SimilarityRequest:
  type: object
  required:
    - textA
    - textB
  properties:
    textA:
      type: string
      description: Input text A
    textB:
      type: string
      description: Input text B
    model:
      type: string
      nullable: true
      description: Optional embedding model

SimilarityResponse:
  type: object
  required:
    - similarityScore
  properties:
    similarityScore:
      type: number
      format: float
      minimum: 0
      maximum: 1

EmbeddingRequest:
  type: object
  required:
    - text
  properties:
    text:
      type: string
    model:
      type: string
      nullable: true

EmbeddingResponse:
  type: object
  required:
    - vector
    - dimension
  properties:
    vector:
      type: array
      items:
        type: number
    dimension:
      type: integer
```
